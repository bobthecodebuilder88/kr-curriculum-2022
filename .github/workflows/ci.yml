name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest

      # -rs: 건너뛴 테스트의 이유를 로그에 남긴다. 원본 코퍼스(부처 고시 원문 93MB)를
      # 읽는 테스트들은 저장소에 원문이 없어 러너에서 skip 된다 — tests/conftest.py 참고.
      - name: unit tests
        run: python3 -m pytest tests/ -v -rs

      # 아래 스모크가 쓰는 코드·진술문·성취수준은 워크플로에 적어 두지 않고 지금의
      # data/ 에서 뽑는다. 여기 박아 두면 데이터를 다시 빌드할 때 낡는데, 낡는 방향이
      # 하필 '통과'다 — 사라진 코드는 여전히 FAKE 로 잡히고 옛 진술문은 여전히
      # MISMATCH 라, 아무것도 지키지 않게 된 게이트가 계속 초록으로 남는다.
      - name: derive smoke fixtures from data/
        run: python3 .github/smoke_fixtures.py "$RUNNER_TEMP/fx"

      - name: smoke — lookup finds a known standard
        run: |
          fx="$RUNNER_TEMP/fx"
          out=$(python3 scripts/lookup.py --school "$(cat "$fx/school.txt")" \
                  --keyword "$(cat "$fx/keyword.txt")" --format md)
          echo "$out"
          echo "$out" | grep -qF -- "[$(cat "$fx/code.txt")]"
          echo "$out" | grep -qF -- "$(cat "$fx/statement.txt")"

      - name: smoke — lookup refuses to invent a missing code
        run: |
          if python3 scripts/lookup.py --code "$(cat "$RUNNER_TEMP/fx/fake-code.txt")" --format md; then
            echo "FAIL: lookup returned a hit for a code that does not exist"; exit 1
          fi

      # 종료 코드만 보면 엉뚱한 이유로 exit 1 이 나도 통과한다. 픽스처를 데이터에서
      # 뽑기 시작한 뒤로는 그럴 여지가 늘어서, 노린 태그가 실제로 나왔는지까지 본다.
      - name: smoke — verify catches a fabricated code
        run: |
          fx="$RUNNER_TEMP/fx"
          if python3 scripts/verify.py "$fx/fake.md" > "$fx/fake.out"; then
            echo "FAIL: verify passed a fabricated code"; exit 1
          fi
          cat "$fx/fake.out"
          grep -q '^FAKE' "$fx/fake.out"

      - name: smoke — verify catches an altered statement
        run: |
          fx="$RUNNER_TEMP/fx"
          if python3 scripts/verify.py "$fx/mismatch.md" > "$fx/mismatch.out"; then
            echo "FAIL: verify passed an altered statement"; exit 1
          fi
          cat "$fx/mismatch.out"
          grep -q '^MISMATCH' "$fx/mismatch.out"

      # 성취수준 서술문도 인용문이다. 진술문만 검사하고 A~E 를 놓치면, 교사가 실제로
      # 평가계획에 옮겨 적는 문장이 검사 밖에 남는다.
      - name: smoke — verify catches an altered level descriptor
        run: |
          fx="$RUNNER_TEMP/fx"
          if python3 scripts/verify.py "$fx/lvldiff.md" > "$fx/lvldiff.out"; then
            echo "FAIL: verify passed an altered 성취수준 descriptor"; exit 1
          fi
          cat "$fx/lvldiff.out"
          grep -q '^LVLDIFF' "$fx/lvldiff.out"

      - name: smoke — verify passes a correct citation
        run: |
          fx="$RUNNER_TEMP/fx"
          python3 scripts/verify.py "$fx/ok.md" --school "$(cat "$fx/school.txt")"

      - name: browse/ is regenerated from data/
        run: |
          python3 -m pipeline.generate_views
          git diff --exit-code -- browse/

      # verify.py 를 리포 전체에 돌리면 안 된다. validation-report.md 는 이 데이터셋이
      # 싣지 '않은' 코드를 일부러 나열하고, README.md·SKILL.md 는 가짜 코드와 변형
      # 진술문을 예시로 싣는다 — 셋 다 구조적으로 언제나 exit 1 이다.
      # 검사 대상은 browse/ 의 생성된 표로만 한정한다. 그중 제2외국어 2개 파일은
      # 진술문 미수록(NOSTMT) 레코드를 담고 있어 역시 항상 exit 1 이라 제외한다.
      - name: generated browse tables cite their own data correctly
        run: |
          n=0
          for f in browse/*/*.md; do
            if grep -qF '진술문 미수록' "$f"; then continue; fi
            python3 scripts/verify.py "$f" > /dev/null || { python3 scripts/verify.py "$f"; exit 1; }
            n=$((n+1))
          done
          echo "verified $n browse tables"
          test "$n" -eq 34
